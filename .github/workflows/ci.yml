name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    # the oracle-backed suites run against the binary the oracle job built;
    # without it they skip, and CI would say nothing about the plugin and the
    # oracle talking to each other
    needs: oracle
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4 is the floor the plugin advertises (plugin/typescope.lua
        # refuses to load below nvim-0.10).
        nvim: ["v0.10.4", "stable", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # tests/run.sh expects nvim-treesitter at this exact path, and reads the
      # python parser out of it. The master branch is the one with
      # :TSInstallSync; nvim-treesitter's main branch has a different API.
      - name: Install nvim-treesitter and the python parser
        run: |
          git clone --depth 1 --branch master \
            https://github.com/nvim-treesitter/nvim-treesitter \
            "$HOME/.local/share/nvim/lazy/nvim-treesitter"
          nvim --headless --clean \
            --cmd "set rtp+=$HOME/.local/share/nvim/lazy/nvim-treesitter" \
            -c "TSInstallSync python" -c "qa!"

      # where a local `scripts/build-oracle.sh` puts it, so every suite finds
      # it the same way a dev checkout does (oracle.locate's checkout
      # fallback); artifacts drop the executable bit
      - uses: actions/download-artifact@v4
        with:
          name: typescope-oracle-debug
          path: oracle/target/debug
      - name: Make the oracle executable
        run: chmod +x oracle/target/debug/typescope-oracle

      - name: Run the suites
        run: ./tests/run.sh

  oracle:
    # The Rust half: the fixture markers in tests/fixtures/shapes.py are
    # asserted here, by cargo test against the patched, vendored pyrefly.
    # The debug binary it builds is handed to the nvim jobs above, which run
    # the Lua side's oracle-backed suites against it.
    name: oracle (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oracle
      - name: Build (applies the pyrefly patch)
        run: scripts/build-oracle.sh
      - name: cargo test
        run: cd oracle && cargo test
      - uses: actions/upload-artifact@v4
        with:
          name: typescope-oracle-debug
          path: oracle/target/debug/typescope-oracle
          if-no-files-found: error
          retention-days: 1

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - name: Lint
        run: luacheck lua/ tests/

  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/
